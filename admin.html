<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ocey P. x — Admin</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">ocey <i>P.</i> x</a><a href="index.html">PUBLIC</a></header><main><section id="loginBox" class="login"><small>NOXTIC CONTROL / ADMIN</small><h1>Welcome back.</h1><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button>ENTER PANEL</button></form><div id="loginStatus"></div></section><section id="adminPanel" hidden><div class="adminHead"><div><small>MINUZA-OCX / 60 TOOLS</small><h1>Control room.</h1></div><div class="actions"><label class="addMedia">+ ADD MEDIA<input id="adminUpload" type="file" accept="image/*,video/*" multiple hidden></label><button id="refreshBtn">REFRESH</button><button id="logoutBtn">LOGOUT</button></div></div><div class="stats"><div><b id="totalCount">0</b><span>TOTAL</span></div><div><b id="photoCount">0</b><span>PHOTOS</span></div><div><b id="videoCount">0</b><span>VIDEOS</span></div><div><b id="storageCount">0 MB</b><span>SIZE</span></div></div><section class="featurePanel"><div class="featureTop"><h2>60 Admin Features</h2><input id="featureSearch" placeholder="Find feature..."></div><div id="features" class="features"></div></section><section class="toolbar"><input id="adminSearch" placeholder="Search files..."><div><button class="filter active" data-admin-filter="all">ALL</button><button class="filter" data-admin-filter="image">PHOTO</button><button class="filter" data-admin-filter="video">VIDEO</button></div></section><div id="adminStatus"></div><section id="adminGallery" class="gallery"></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="admin.js"></script></body></html>
